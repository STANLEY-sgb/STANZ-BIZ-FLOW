name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bizflow
          POSTGRES_PASSWORD: bizflow
          POSTGRES_DB: bizflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bizflow" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL, includes concurrency tests)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bizflow:bizflow@localhost:5432/bizflow_test
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
