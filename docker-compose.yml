# Local development stack. Values here are development-only placeholders.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bizflow
      POSTGRES_PASSWORD: bizflow-dev-only
      POSTGRES_DB: bizflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflow"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://bizflow:bizflow-dev-only@db:5432/bizflow
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      LOCAL_STORAGE_DIR: /data/uploads
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  uploads:
