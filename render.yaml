# Render Blueprint: one-click API + PostgreSQL. See docs/DEPLOYMENT.md ("Quick cloud demo").
# Free plans sleep when idle (first request takes ~30-60s) and the free database expires after 30 days;
# switch both `plan:` values to `starter` for a tester/production deployment.
databases:
  - name: bizflow-db
    plan: free
    databaseName: bizflow
    user: bizflow

services:
  - type: web
    name: bizflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*' --workers 1"
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: bizflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOCAL_STORAGE_DIR
        value: /tmp/uploads
