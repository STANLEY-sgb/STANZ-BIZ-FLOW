# Sized for 8-16 GB development machines (the Flutter template default of 8G caused OOM kills).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Cap the Kotlin compile daemon (in-process compilation broke parallel plugin builds on Windows).
kotlin.daemon.jvmargs=-Xmx1G
# Kotlin incremental caches fail when plugin sources (Pub cache on C:) and the build dir are on different
# drives on Windows ("Could not close incremental caches"). Plugin modules are small, so this costs little.
kotlin.incremental=false
